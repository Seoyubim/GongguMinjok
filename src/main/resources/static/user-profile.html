<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>유저 프로필 - 공구의 민족</title>

  <link rel="icon" href="images/logo.jpg">

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/user-profile.css">
</head>

<body>

  <header class="header">
    <div class="container">

      <div class="header-content">

        <a href="index.html" class="logo">
          <img src="images/logo.jpg" class="logo-image">
          <h1 class="logo-text">공구의 민족</h1>
        </a>

        <div class="header-actions">
          <a href="mypage.html" class="btn btn-outline">
            마이페이지
          </a>
          <button id="logoutBtn" class="btn btn-outline">로그아웃</button>
        </div>

      </div>

    </div>
  </header>

  <main class="main-content">

    <div class="user-profile-page">

      <section class="profile-card-v2">

        <div class="profile-top">

          <img src="images/default-profile.png" class="profile-img-lg">

          <div class="profile-info">

            <div class="profile-name-wrap">
              <h2 class="nickname">공구왕</h2>

              <div class="premium-badge">
                👑 PREMIUM
              </div>
            </div>

            <p class="user-location">
              📍 광주 북구
            </p>

            <div class="manner-grade legend">
              👑 LEGEND
            </div>

          </div>

        </div>

        <div class="manner-section">

          <div class="manner-header">
            <span>매너 점수</span>
            <strong>4.8</strong>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" style="width:96%"></div>
          </div>

        </div>

        <div class="summary-box">

          <div>
            <span>참여</span>
            <strong>32</strong>
          </div>

          <div>
            <span>생성</span>
            <strong>14</strong>
          </div>

          <div>
            <span>완료</span>
            <strong>28</strong>
          </div>

        </div>

        <div class="profile-extra">
          <p><strong>가입일</strong> : 2024.03</p>
        </div>

      </section>

      <section class="review-card">

        <div class="review-card-header">

          <h3>받은 후기</h3>

        </div>

        <div class="review-list">

          <div class="review-item">
            😄 "시간 약속 잘 지켜주셨어요!"
          </div>

          <div class="review-item">
            👍 "응답이 빨라서 거래하기 편했어요."
          </div>

          <div class="review-item">
            🌟 "포장도 깔끔하고 친절했습니다."
          </div>

        </div>

      </section>

    </div>

  </main>

</body>

</html>
