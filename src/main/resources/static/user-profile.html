<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>유저 프로필 - 공구의 민족</title>

  <link rel="icon" href="images/logo.jpg">

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/user-profile.css">
</head>

<body>

  <header class="header">
    <div class="container">

      <div class="header-content">

        <a href="index.html" class="logo">
          <img src="images/logo.jpg" class="logo-image">
          <h1 class="logo-text">공구의 민족</h1>
        </a>

        <div class="header-actions">
          <a href="mypage.html" class="btn btn-outline">
            마이페이지
          </a>
          <button id="logoutBtn" class="btn btn-outline">로그아웃</button>
        </div>

      </div>

    </div>
  </header>

  <main class="main-content">

    <div class="user-profile-page">

      <section class="profile-card-v2">

        <div class="profile-top">

          <img id="profileImg" src="images/default-profile.png" class="profile-img-lg">

          <div class="profile-info">

            <div class="profile-name-wrap">
              <h2 id="profileNickname" class="nickname"></h2>

              <div id="premiumBadge" class="premium-badge hidden">
                👑 PREMIUM
              </div>
            </div>

            <div id="mannerGrade" class="manner-grade"></div>

          </div>

        </div>

        <div class="manner-section">

          <div class="manner-header">
            <span>매너 점수</span>
            <strong id="mannerScore"></strong>
          </div>

          <div class="progress-bar">
            <div id="mannerBar" class="progress-fill" style="width:0%"></div>
          </div>

        </div>

        <div class="summary-box">

          <div>
            <span>참여</span>
            <strong id="joinCount">-</strong>
          </div>

          <div>
            <span>생성</span>
            <strong id="createCount">-</strong>
          </div>

          <div>
            <span>월 생성횟수</span>
            <strong id="monthlyCount">-</strong>
          </div>

        </div>

      </section>

      <section class="review-card">

        <div class="review-card-header">
          <h3>받은 후기</h3>
        </div>

        <div id="reviewList" class="review-list"></div>

      </section>

    </div>

  </main>

  <script src="js/utils/ui.js"></script>
  <script src="js/api/userApi.js"></script>
  <script src="js/api/groupBuyApi.js"></script>
  <script src="js/pages/user-profile.js"></script>

</body>

</html>
