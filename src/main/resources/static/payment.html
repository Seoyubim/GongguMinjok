<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제하기 - 공구의 민족</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/payment.css">
</head>
<body>

<header class="header">
  <div class="container">
    <div class="header-content">
      <a href="javascript:history.back()" class="logo">
        <img src="images/logo.jpg" alt="공구의 민족 로고" class="logo-image">
        <h1 class="logo-text">공구의 민족</h1>
      </a>
    </div>
  </div>
</header>

<main class="main-content">
  <div class="payment-page">

    <div class="payment-info-card">
      <span class="payment-role-badge" id="payment-role-badge"></span>
      <p class="payment-group-title" id="payment-group-title">불러오는 중...</p>
      <div class="payment-amount-row">
        <span>결제 금액</span>
        <strong id="payment-amount">—</strong>
      </div>
    </div>

    <div id="payment-method"></div>
    <div id="agreement"></div>

  </div>
</main>

<div class="payment-btn-wrap">
  <button id="pay-btn" class="btn btn-primary btn-full" type="button">결제하기</button>
</div>

<script src="https://js.tosspayments.com/v2/standard"></script>
<script src="js/api/groupBuyApi.js"></script>
<script src="js/utils/storage.js"></script>
<script src="js/pages/payment.js"></script>
</body>
</html>
