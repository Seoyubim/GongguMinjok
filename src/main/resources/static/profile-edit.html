<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필 수정 - 공구의 민족</title>

  <link rel="icon" href="images/logo.jpg">

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/profile-edit.css">
</head>

<body>


  <main class="main-content">

    <div class="profile-edit-page">

      <div class="profile-edit-card">

        <h2 class="edit-title">내 정보 수정</h2>

        <div class="profile-image-section">
          <div class="profile-img-wrapper" id="profileWrapper">
            <img src="images/default-profile.png" class="profile-preview" id="profilePreview">
            <div class="profile-overlay" id="profileOverlay">✕</div>
          </div>
          <label for="profileImage" class="btn btn-outline profile-upload-btn">프로필 사진 변경</label>
          <input type="file" id="profileImage" accept="image/*" hidden>
        </div>

        <div class="form-group">
          <label>닉네임</label>
          <input type="text" id="nickname" placeholder="닉네임 입력">
        </div>

        <button type="button" class="btn-password-toggle" id="btn-password-toggle">
          비밀번호 변경 <span id="password-toggle-icon">▼</span>
        </button>

        <div id="password-section" style="display:none">
          <div class="form-group">
            <label>현재 비밀번호</label>
            <input type="password" id="currentPassword" placeholder="현재 비밀번호 입력">
          </div>
          <div class="form-group">
            <label>새 비밀번호</label>
            <input type="password" id="newPassword" placeholder="새 비밀번호 입력">
          </div>
          <div class="form-group">
            <label>새 비밀번호 확인</label>
            <input type="password" id="newPasswordConfirm" placeholder="비밀번호 다시 입력">
          </div>
        </div>

        <div class="form-group">
          <label>전화번호</label>
          <input type="text" id="phone" placeholder="010-0000-0000">
        </div>

        <div class="form-group">
          <label>주소</label>
          <input type="hidden" id="location">
          <button class="addr-search-btn" type="button" id="btn-addr-search">🔍 주소 검색</button>
          <div class="err-msg" id="addr-err" style="margin-top:8px"></div>
          <div class="addr-result hidden" id="addr-result"></div>
        </div>

        <button type="button" class="btn-password-toggle" id="btn-account-toggle">
          계좌 정보 등록 <span id="account-toggle-icon">▼</span>
        </button>

        <div id="account-section" style="display:none">
          <div class="form-group">
            <label>은행명</label>
            <select id="bankName">
              <option value="">은행 선택</option>
              <option value="KB국민은행">KB국민은행</option>
              <option value="신한은행">신한은행</option>
              <option value="우리은행">우리은행</option>
              <option value="하나은행">하나은행</option>
              <option value="NH농협은행">NH농협은행</option>
              <option value="IBK기업은행">IBK기업은행</option>
              <option value="카카오뱅크">카카오뱅크</option>
              <option value="토스뱅크">토스뱅크</option>
              <option value="케이뱅크">케이뱅크</option>
            </select>
          </div>
          <div class="form-group">
            <label>계좌번호</label>
            <input type="text" id="accountNumber" placeholder="계좌번호 입력 (- 없이)">
          </div>
          <div class="form-group">
            <label>예금주</label>
            <input type="text" id="accountHolder" placeholder="예금주명 입력">
          </div>
        </div>

        <div class="edit-actions">
          <button class="btn btn-primary" id="btn-save">저장하기</button>
          <a href="mypage.html" class="btn btn-outline">취소</a>
        </div>

      </div>

    </div>

  </main>

  <div id="toast" class="toast"></div>

  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="js/api/userApi.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/ui.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/api/groupBuyApi.js"></script>
  <script src="js/api/notificationApi.js"></script>
  <script src="js/utils/header.js"></script>
  <script src="js/pages/profile-edit.js"></script>

</body>

</html>
