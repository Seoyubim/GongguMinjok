<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거래 후기 작성 - 공구의 민족</title>
  <link rel="icon" href="images/logo.jpg">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/review.css">
</head>

<body>

  <main class="main-content">
    <div class="review-container">

      <h1 class="review-title">거래 후기 작성</h1>

      <div id="participantSection" class="review-section" style="display:none">
        <label>후기를 작성할 참여자</label>
        <select id="participantSelect" class="select-box"></select>
      </div>

      <div class="review-section">
        <label>거래 선호도</label>
        <div class="rating-group">
          <button class="rating-btn" data-value="BAD">별로예요</button>
          <button class="rating-btn active" data-value="GOOD">좋아요</button>
          <button class="rating-btn" data-value="GREAT">최고예요</button>
        </div>
      </div>

      <div class="review-section">
        <label>상세 평가</label>
        <div id="checklist" class="checklist-box"></div>
      </div>

      <button class="btn btn-primary btn-full" id="submitBtn">
        후기 제출하기
      </button>

    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/utils/ui.js"></script>
  <script src="js/api/groupBuyApi.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/api/userApi.js"></script>
  <script src="js/api/notificationApi.js"></script>
  <script src="js/utils/header.js"></script>
  <script src="js/pages/review.js"></script>

</body>
</html>
